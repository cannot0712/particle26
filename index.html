<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>放課後の学校</title>

<!-- ドット絵フォント -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ===== 全体 ===== */
body {
  margin: 0;
  background: black;
  font-family: 'Press Start 2P', monospace;
  color: white;
}

/* ===== 背景 ===== */
#bg {
  width: 100vw;
  height: 100vh;
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 暗転 */
.fade {
  animation: fadeout 1.5s forwards;
}
@keyframes fadeout {
  from { opacity: 1; }
  to { opacity: 0; }
}

/* ===== ゲーム画面 ===== */
#game {
  width: 80%;
  max-width: 600px;
  background: rgba(0,0,0,0.7);
  border: 2px solid #888;
  padding: 16px;
}

/* ===== ストーリー ===== */
#story {
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 16px;
  white-space: pre-line;
}

/* ===== 選択肢 ===== */
#choices button {
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  background: #111;
  color: white;
  border: 2px solid #666;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  cursor: pointer;
}

#choices button:hover {
  background: #333;
  border-color: white;
}

/* ===== チュートリアル ===== */
#guide {
  margin-top: 12px;
  padding: 10px;
  border: 2px solid #555;
  font-size: 10px;
  line-height: 1.6;
}

/* 画面端用 */
#guide.edge {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 220px;
  opacity: 0.6;
}
</style>
</head>

<body>
<div id="bg">
  <div id="game">
    <div id="story"></div>
    <div id="choices"></div>
    <div id="guide"></div>
  </div>
</div>

<script>
let quitOnce = false;

/* ===== シーン定義 ===== */
const scenes = {
  0: {
    text: "ホウカゴノ ガッコウ。\nダレモ イナイ。",
    guide: "",
    edgeGuide: false,
    bg: "images/school.jpg",
    choices: () => {
      if (quitOnce) {
        return [
          { label: "ゲームを始める", next: 1 }
        ];
      }
      return [
        { label: "ゲームを始める", next: 1 },
        { label: "ゲームをやめる", next: "quit" }
      ];
    }
  },

  1: {
    text: "ホウカゴノ ガッコウ。\nナゼカ ダレモ イナイ。\nアタリハ ヒガ オチテキタ。",
    guide: "センタクシヲ エラビ、\nゲームヲ ススメマショウ。",
    edgeGuide: true,
    bg: "images/school_evening.jpg",
    choices: [
      { label: "アタリヲ ミワタス", next: 2 }
    ]
  },

  2: {
    text: "オクノ キョウシツカラ\nモノオトガ シタ。\nダレカ イルノダロウカ。\nノゾキニ イコウカナ。",
    guide: "センタクシヲ エラビ、\nゲームヲ ススメマショウ。",
    edgeGuide: true,
    bg: "images/hallway.jpg",
    choices: [
      { label: "オクニ ススム", next: 3 }
    ]
  },

  3: {
    text: "……",
    guide: "ヨク デキマシタ。",
    edgeGuide: false,
    bg: "images/dark.jpg",
    choices: []
  }
};

/* ===== 表示処理 ===== */
function showScene(id) {
  const scene = scenes[id];
  const bg = document.getElementById("bg");
  const story = document.getElementById("story");
  const guide = document.getElementById("guide");
  const choicesDiv = document.getElementById("choices");

  bg.style.backgroundImage = `url('${scene.bg}')`;
  story.innerText = scene.text;

  guide.innerText = scene.guide || "";
  guide.className = scene.edgeGuide ? "edge" : "";

  choicesDiv.innerHTML = "";

  const choices =
    typeof scene.choices === "function"
      ? scene.choices()
      : scene.choices;

  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = c.label;
    btn.onclick = () => {
      if (c.next === "quit") {
        quitOnce = true;
        bg.classList.add("fade");
        setTimeout(() => {
          bg.classList.remove("fade");
          showScene(0);
        }, 1500);
      } else {
        showScene(c.next);
      }
    };
    choicesDiv.appendChild(btn);
  });
}

/* ===== 開始 ===== */
showScene(0);
</script>
</body>
</html>
