<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推しは今日も、嘘をつく。</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:"Yu Gothic",sans-serif;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
}

/* 背景 */

#background{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    transition:1s;
    filter:brightness(.45);
}

/* オーバーレイ */

#overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        rgba(0,0,0,.15),
        rgba(0,0,0,.75)
    );
}

/* タイトル */

#titleScreen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    z-index:20;
}

#title{
    font-size:58px;
    letter-spacing:4px;
    margin-bottom:15px;
}

#subtitle{
    opacity:.7;
    margin-bottom:40px;
}

button{
    background:#ff4fa3;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

button:hover{
    transform:scale(1.04);
}

/* UI */

#ui{
    display:none;
}

/* ステータス */

#stats{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,.5);
    padding:12px;
    border-radius:10px;
    line-height:1.8;
    z-index:10;
}

/* 心理描写 */

#mind{
    position:absolute;
    top:90px;
    left:15px;
    width:350px;
    background:rgba(255,255,255,.06);
    border-left:3px solid #ff4fa3;
    padding:14px;
    font-size:14px;
    line-height:1.8;
    opacity:.9;
    z-index:10;
}

/* テキスト */

#textbox{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,.82);
    padding:25px;
    z-index:10;
}

#name{
    color:#ff7bc0;
    font-size:22px;
    margin-bottom:10px;
    font-weight:bold;
}

#text{
    min-height:120px;
    line-height:1.9;
    font-size:19px;
    white-space:pre-wrap;
}

/* 選択肢 */

#choices{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.choice{
    background:#1d1d1d;
    border:1px solid #ff4fa3;
    text-align:left;
}

/* END */

#ending{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    z-index:30;
    text-align:center;
    padding:40px;
}

#ending h1{
    color:#ff7bc0;
    font-size:52px;
    margin-bottom:25px;
}

#ending p{
    max-width:700px;
    line-height:2;
}

/* 演出 */

.fade{
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.glitch{
    animation:glitch .1s infinite;
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(-2px,2px)}
    50%{transform:translate(2px,-2px)}
    75%{transform:translate(-1px,1px)}
}

</style>
</head>
<body>

<div id="game">

    <div id="background"></div>
    <div id="overlay"></div>

    <!-- タイトル -->
    <div id="titleScreen">

        <div id="title">推しは今日も、嘘をつく。</div>
        <div id="subtitle">コンカフェ嬢攻略ADV</div>

        <button onclick="startGame()">GAME START</button>

    </div>

    <!-- UI -->
    <div id="ui">

        <!-- ステータス -->
        <div id="stats">
            好感度：<span id="love">0</span><br>
            依存度：<span id="depend">0</span><br>
            現実性：<span id="reality">0</span>
        </div>

        <!-- 心理 -->
        <div id="mind">
            まだ、ただの“推し活”だと思っていた。
        </div>

        <!-- テキスト -->
        <div id="textbox">

            <div id="name"></div>

            <div id="text"></div>

            <div id="choices"></div>

        </div>

    </div>

    <!-- END -->
    <div id="ending">

        <h1 id="endingTitle"></h1>

        <p id="endingText"></p>

        <br><br>

        <button onclick="location.reload()">タイトルへ戻る</button>

    </div>

</div>

<!-- BGM -->
<audio id="bgm" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8e9a5b7.mp3?filename=dreamy-ambient-11157.mp3">
</audio>

<script>

let love = 0;
let depend = 0;
let reality = 0;

let currentScene = 0;

const bg = document.getElementById("background");

const loveEl = document.getElementById("love");
const dependEl = document.getElementById("depend");
const realityEl = document.getElementById("reality");

const nameEl = document.getElementById("name");
const textEl = document.getElementById("text");
const choicesEl = document.getElementById("choices");

const mindEl = document.getElementById("mind");

const bgm = document.getElementById("bgm");

/* 背景 */

const backgrounds = {

cafe:
"https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1200",

night:
"https://images.unsplash.com/photo-1508057198894-247b23fe5ade?q=80&w=1200",

station:
"https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200",

street:
"https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1200"

};

/* シーン */

const scenes = [

{
bg:"cafe",
mind:"ただの好奇心だった。\n少しだけ覗いてみるつもりだった。",
name:"",
text:"繁華街の路地裏。\n\nコンセプトカフェ『Black Alice』。\n\n扉を開けると、甘い香水の匂いと笑い声が混ざっていた。",
choices:[
{
text:"店内を見渡す",
effect:()=>{}
}
]
},

{
bg:"cafe",
mind:"かわいい。\n最初に思ったのは、それだけだった。",
name:"リリア",
text:"「はじめまして〜！新人のご主人様？」",
choices:[
{
text:"おすすめのドリンクある？",
effect:()=>{love+=1;}
},
{
text:"こういう店初めてで…",
effect:()=>{love+=1; reality+=1;}
},
{
text:"君が一番人気？",
effect:()=>{depend+=1;}
}
]
},

{
bg:"cafe",
mind:"距離が近い。\nでも、これが“接客”なんだろう。",
name:"リリア",
text:"「え〜、緊張してる？\nかわい〜♡」",
choices:[
{
text:"少し照れる",
effect:()=>{love+=1;}
},
{
text:"営業上手だね",
effect:()=>{reality+=1;}
},
{
text:"ドキッとする",
effect:()=>{depend+=1;}
}
]
},

{
bg:"street",
mind:"帰り道なのに、まだ声が頭から離れない。",
name:"",
text:"スマホが震えた。\n\nリリア：\n『今日は来てくれてありがと〜♡』",
choices:[
{
text:"すぐ返信する",
effect:()=>{depend+=2;}
},
{
text:"少し悩んでから返す",
effect:()=>{reality+=1;}
}
]
},

{
bg:"night",
mind:"たった一通のDMなのに。\n少し特別になれた気がした。",
name:"リリア",
text:"『また会いたいな』",
choices:[
{
text:"俺も会いたい",
effect:()=>{love+=1; depend+=1;}
},
{
text:"ありがとう",
effect:()=>{reality+=1;}
}
]
},

{
bg:"cafe",
mind:"気づけば、また来ていた。",
name:"リリア",
text:"「来てくれると思った♡」",
choices:[
{
text:"会いたくて",
effect:()=>{love+=2;}
},
{
text:"なんとなく",
effect:()=>{reality+=1;}
},
{
text:"他の客にも言ってる？",
effect:()=>{depend+=1;}
}
]
},

{
bg:"cafe",
mind:"自分だけだと思いたかった。",
name:"",
text:"リリアが別の客に向かって笑っている。\n\n『だいすき〜♡』",
choices:[
{
text:"見なかったことにする",
effect:()=>{reality+=2;}
},
{
text:"胸がざわつく",
effect:()=>{depend+=2;}
},
{
text:"もっと通えば変わる？",
effect:()=>{depend+=3;}
}
]
},

{
bg:"night",
mind:"“営業”だって分かってる。\nなのに期待してしまう。",
name:"リリア",
text:"『今だけ電話しない？』",
choices:[
{
text:"すぐ出る",
effect:()=>{depend+=2; love+=1;}
},
{
text:"少し迷う",
effect:()=>{reality+=1;}
},
{
text:"出ない",
effect:()=>{reality+=2;}
}
]
},

{
bg:"station",
mind:"少し疲れている自分に気づき始めていた。",
name:"リリア",
text:"「最近、来る回数減ったよね？」",
choices:[
{
text:"ごめん",
effect:()=>{love+=1;}
},
{
text:"少し考えたくて",
effect:()=>{reality+=3;}
},
{
text:"嫉妬した",
effect:()=>{depend+=2;}
}
]
}

];

/* 開始 */

function startGame(){

document.getElementById("titleScreen").style.display="none";
document.getElementById("ui").style.display="block";

bgm.volume = 0.25;
bgm.play();

showScene();

}

/* ステータス */

function updateStats(){

loveEl.textContent = love;
dependEl.textContent = depend;
realityEl.textContent = reality;

}

/* タイピング */

function typeText(text, element, callback){

element.textContent = "";

let i = 0;

const interval = setInterval(()=>{

element.textContent += text[i];

i++;

if(i >= text.length){

clearInterval(interval);

if(callback) callback();

}

},25);

}

/* シーン */

function showScene(){

const scene = scenes[currentScene];

bg.style.backgroundImage =
`url(${backgrounds[scene.bg]})`;

nameEl.textContent = scene.name;

choicesEl.innerHTML = "";

typeText(scene.mind, mindEl);

typeText(scene.text, textEl, ()=>{

scene.choices.forEach(choice=>{

const btn = document.createElement("button");

btn.className = "choice fade";

btn.textContent = choice.text;

btn.onclick = ()=>{

choice.effect();

updateStats();

currentScene++;

if(depend >= 10){

document.body.classList.add("glitch");

}else{

document.body.classList.remove("glitch");

}

if(currentScene >= scenes.length){

showEnding();

}else{

showScene();

}

};

choicesEl.appendChild(btn);

});

});

}

/* END */

function showEnding(){

document.getElementById("ui").style.display="none";

const end = document.getElementById("ending");

end.style.display = "flex";

const title = document.getElementById("endingTitle");

const text = document.getElementById("endingText");

/* TRUE */

if(reality >= 8){

title.textContent = "END『午前4時の改札』";

text.textContent =
`始発前の駅。

「ちゃんと、自分の生活に戻ろうと思って」

あなたは、
“推し”ではなく、
一人の女の子としてリリアを見ることにした。

彼女は少しだけ寂しそうに笑った。

でもその笑顔は、
初めて“営業”じゃない気がした。`;

}

/* BAD */

else if(depend >= 12){

title.textContent = "END『次の推しへ』";

text.textContent =
`気づけば、
感情を止められなくなっていた。

独占したかった。

特別になりたかった。

でも、
リリアには他にも客がいる。

店を出たあと、
ネオン街の光だけがやけに眩しかった。`;

}

/* HAPPY */

else{

title.textContent = "END『鎖越しの愛』";

text.textContent =
`「もう、他の人のところ行かないで」

リリアはそう言って笑った。

大学も、
仕事も、
少しずつ遠くなっていく。

でも、
彼女が隣にいるだけで幸せだった。`;

}

}

updateStats();

</script>
</body>
</html>
