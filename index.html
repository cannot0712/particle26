<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mouse & Cheese Simulation</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
const PARTICLE_COUNT = 120;

// マウス（カーソル）
const cursor = { x: null, y: null };

// ネズミ（自動で動く）
const mouseChar = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 2,
    vy: 1.5,
    size: 20
};

window.addEventListener("mousemove", (e) => {
    cursor.x = e.x;
    cursor.y = e.y;
});

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// チーズ粒
class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseX = this.x;
        this.baseY = this.y;

        this.size = Math.random() * 6 + 6;
        this.density = Math.random() * 30 + 1;
    }

    draw() {
        ctx.fillStyle = "#FFD84D"; // チーズ色
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }

    attract(targetX, targetY, strength) {
        let dx = targetX - this.x;
        let dy = targetY - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        let maxDistance = 150;

        if (distance < maxDistance && distance > 0) {
            let force = (maxDistance - distance) / maxDistance;
            this.x += (dx / distance) * force * this.density * strength;
            this.y += (dy / distance) * force * this.density * strength;
        }
    }

    update() {
        // カーソルに引き寄せ
        if (cursor.x !== null) {
            this.attract(cursor.x, cursor.y, 0.3);
        }

        // ネズミに引き寄せ（強め）
        this.attract(mouseChar.x, mouseChar.y, 0.5);

        // 元の位置に戻る
        let dx = this.baseX - this.x;
        let dy = this.baseY - this.y;
        this.x += dx * 0.02;
        this.y += dy * 0.02;

        this.draw();
    }
}

// 初期化
function init() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
    }
}

// ネズミ描画（簡易）
function drawMouse() {
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    ctx.arc(mouseChar.x, mouseChar.y, mouseChar.size, 0, Math.PI * 2);
    ctx.fill();

    // 耳
    ctx.beginPath();
    ctx.arc(mouseChar.x - 10, mouseChar.y - 15, 8, 0, Math.PI * 2);
    ctx.arc(mouseChar.x + 10, mouseChar.y - 15, 8, 0, Math.PI * 2);
    ctx.fill();

    // 目
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(mouseChar.x - 5, mouseChar.y - 3, 2, 0, Math.PI * 2);
    ctx.arc(mouseChar.x + 5, mouseChar.y - 3, 2, 0, Math.PI * 2);
    ctx.fill();
}

// ネズミ移動
function updateMouse() {
    mouseChar.x += mouseChar.vx;
    mouseChar.y += mouseChar.vy;

    // 壁でバウンド
    if (mouseChar.x < 0 || mouseChar.x > canvas.width) mouseChar.vx *= -1;
    if (mouseChar.y < 0 || mouseChar.y > canvas.height) mouseChar.vy *= -1;
}

// アニメーション
function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    updateMouse();
    drawMouse();

    particles.forEach(p => p.update());

    requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
