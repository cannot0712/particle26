<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>放課後の学校</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: "Yu Gothic", sans-serif;
}

#game {
  width: 100%;
  height: 100%;
  background: linear-gradient(#1b1b2f, #162447);
  color: white;
  position: relative;
}

#textBox {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.7);
  padding: 20px;
  box-sizing: border-box;
}

#name {
  font-weight: bold;
  margin-bottom: 10px;
}

#choices {
  margin-top: 15px;
}

button {
  display: block;
  margin: 8px 0;
  padding: 10px;
  width: 100%;
  background: #e43f5a;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #f95959;
}
</style>
</head>
<body>

<div id="game">
  <div id="textBox">
    <div id="name"></div>
    <div id="text"></div>
    <div id="choices"></div>
  </div>
</div>

<script>
let affection = 0;

const scenes = {
  start: {
    name: "",
    text: "放課後の学校。なぜか誰もいない。",
    choices: [
      { text: "教室に入る", next: "classroom" },
      { text: "帰る", next: "end" }
    ]
  },

  classroom: {
    name: "リリア",
    text: "……来ちゃったんだ。",
    choices: [
      { text: "声をかける", affection: +1, next: "talk" },
      { text: "黙って様子を見る", affection: -1, next: "talk" }
    ]
  },

  talk: {
    name: "リリア",
    text: () => {
      if (affection >= 1) return "少し安心した顔で、こちらを見る。";
      return "警戒した目で距離を取っている。";
    },
    choices: [
      { text: "「大丈夫？」と聞く", affection: +1, next: "truth" },
      { text: "何も言わない", next: "truth" }
    ]
  },

  truth: {
    name: "リリア",
    text: () => {
      if (affection >= 2) return "……ねえ。私、嘘ついてた。";
      return "用がないなら、帰って。";
    },
    choices: [
      { text: "話を聞く", next: "goodEnd" },
      { text: "立ち去る", next: "badEnd" }
    ]
  },

  goodEnd: {
    name: "",
    text: "夕焼けの校舎で、二人だけの秘密が始まった。",
    choices: []
  },

  badEnd: {
    name: "",
    text: "その日以来、彼女を見ることはなかった。",
    choices: []
  },

  end: {
    name: "",
    text: "あなたは何も知らずに家へ帰った。",
    choices: []
  }
};

function showScene(key) {
  const scene = scenes[key];
  document.getElementById("name").textContent = scene.name;
  document.getElementById("text").textContent =
    typeof scene.text === "function" ? scene.text() : scene.text;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scene.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.textContent = c.text;
    btn.onclick = () => {
      if (c.affection) affection += c.affection;
      showScene(c.next);
    };
    choicesDiv.appendChild(btn);
  });
}

showScene("start");
</script>

</body>
</html>
