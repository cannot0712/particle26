<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Choice Adventure Demo</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    margin-top: 40px;
  }
  .game {
    width: 600px;
    background: #1a1a1a;
    border: 1px solid #444;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin-bottom: 10px;
  }
  .text {
    min-height: 120px;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .choices button {
    width: 100%;
    margin: 5px 0;
    padding: 10px;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    cursor: pointer;
  }
  .choices button:hover {
    background: #444;
  }
  .guide {
    margin-top: 15px;
    padding: 10px;
    border: 1px solid;
    font-size: 14px;
  }
</style>
</head>

<body>
<div class="game">
  <h1>Choice Adventure</h1>

  <div class="text" id="story"></div>

  <div class="choices" id="choices"></div>

  <div class="guide" id="guide"></div>
</div>

<script>
const scenes = {
  1: {
    text: "放課後の学校。\nなぜか今日は、誰もいない。\n帰ろうとしたその時、声が聞こえた。",
    guide: "落ち着いて。\n画面の選択肢を選べば進めます。",
    color: "#4da6ff",
    choices: [
      { label: "声の正体を探す", next: 2 },
      { label: "無視して帰る", next: 5 }
    ]
  },

  2: {
    text: "教室の黒板に、\n見覚えのない文字が書かれている。\n「――思い出して」",
    guide: "いい選択ですね。\nそのまま進めば大丈夫です。",
    color: "#f0c674",
    choices: [
      { label: "黒板を調べる", next: 3 },
      { label: "廊下に出る", next: 4 }
    ]
  },

  3: {
    text: "黒板に触れた瞬間、\n忘れていた記憶がよみがえった。",
    guide: "……そう。\nそれでいい。",
    color: "#ff9933",
    choices: [
      { label: "廊下に出る", next: 4 }
    ]
  },

  4: {
    text: "廊下の奥に、\n見慣れない扉がある。",
    guide: "ここまで来たのなら、\n進むべきです。",
    color: "#ff5555",
    choices: [
      { label: "扉を開ける", next: 6 },
      { label: "引き返す", next: 5 }
    ]
  },

  5: {
    text: "あなたは学校を後にした。\n何事もなかったかのように日常は続く。",
    guide: "……",
    color: "#666",
    choices: [
      { label: "最初から", next: 1 }
    ]
  },

  6: {
    text: "「そう、気づいてしまったね。」\n「私は、案内していただけ。」\nすべては、最初から決まっていた。",
    guide: "ありがとう。\n最高の選択だった。",
    color: "#ff0000",
    choices: [
      { label: "タイトルへ戻る", next: 1 }
    ]
  }
};

let current = 1;

function showScene(id) {
  const scene = scenes[id];
  current = id;

  document.getElementById("story").innerText = scene.text;

  const guide = document.getElementById("guide");
  guide.innerText = "案内人：\n" + scene.guide;
  guide.style.borderColor = scene.color;
  guide.style.color = scene.color;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scene.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = c.label;
    btn.onclick = () => showScene(c.next);
    choicesDiv.appendChild(btn);
  });
}

showScene(current);
</script>
</body>
</html>
