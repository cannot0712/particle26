<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推しは今日も、嘘をつく。</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:black;
    color:white;
    font-family:"Yu Gothic",sans-serif;
    overflow:hidden;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
}

/* 背景 */
#background{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    filter:brightness(.45);
    transition:1s;
}

/* 暗幕 */
#overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.85));
}

/* タイトル */
#titleScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    z-index:10;
}

#title{
    font-size:56px;
    letter-spacing:4px;
    margin-bottom:20px;
}

#subtitle{
    opacity:.7;
    margin-bottom:40px;
}

button{
    background:#ff4fa3;
    border:none;
    color:white;
    padding:14px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{transform:scale(1.05);}

/* UI */
#ui{display:none;}

#stats{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,.5);
    padding:12px;
    border-radius:10px;
    line-height:1.8;
    z-index:5;
}

/* テキスト */
#textbox{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,.85);
    padding:28px;
    z-index:5;
}

#name{
    color:#ff7bc0;
    font-weight:bold;
    margin-bottom:10px;
    font-size:22px;
}

#text{
    min-height:140px;
    line-height:2;
    font-size:20px;
    white-space:pre-wrap;
    cursor:pointer;
}

#choices{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.choice{
    background:#1d1d1d;
    border:1px solid #ff4fa3;
    text-align:left;
}

/* END */
#ending{
    position:absolute;
    inset:0;
    background:black;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    z-index:20;
}

#ending h1{
    color:#ff7bc0;
    font-size:48px;
    margin-bottom:25px;
}
</style>
</head>

<body>
<div id="game">
    <div id="background"></div>
    <div id="overlay"></div>

    <div id="titleScreen">
        <div id="title">推しは今日も、嘘をつく。</div>
        <div id="subtitle">コンカフェ嬢攻略ADV</div>
        <button onclick="startGame()">GAME START</button>
    </div>

    <div id="ui">
        <div id="stats">
            好感度：<span id="love">0</span><br>
            依存度：<span id="depend">0</span><br>
            現実性：<span id="reality">0</span>
        </div>

        <div id="textbox">
            <div id="name"></div>
            <div id="text"></div>
            <div id="choices"></div>
        </div>
    </div>

    <div id="ending">
        <h1 id="endingTitle"></h1>
        <p id="endingText"></p><br><br>
        <button onclick="location.reload()">タイトルへ戻る</button>
    </div>
</div>

<script>
/* ステータス */
let love=0, depend=0, reality=0;
let sceneIndex=0, pageIndex=0;

/* 背景 */
const backgrounds={
    street:"3E5432C3-2703-472D-B465-6F16FEE1B8F5.jpeg",
    cafe:"E7514306-6E15-4518-9346-DA02725635F8.png",
    night:"828769FF-5428-48F6-9EF8-B424A98445AC.jpeg",
    station:"5E45E54D-328D-4FAE-A4C2-357E2329C720.jpeg",
    room:"FCE43578-31A9-4071-8292-6718C43EF5F1.jpeg"
};

/* シーン */
const scenes=[
{
bg:"street",
pages:[
{text:"放課後の繁華街。\n\n少しだけ、寄り道するつもりだった。"},
{name:"リリア",text:"「はじめまして〜♡ ご主人様？」"}
],
choices:[
{text:"おすすめ聞く",effect:()=>love++},
{text:"初めてで…",effect:()=>{love++;reality++;}},
{text:"人気ある？",effect:()=>depend++}
]
},
{
bg:"cafe",
pages:[
{name:"",text:"距離が近い。"},
{name:"リリア",text:"「緊張してる？ かわい〜♡」"}
],
choices:[
{text:"照れる",effect:()=>love++},
{text:"営業だね",effect:()=>reality++},
{text:"ドキッとする",effect:()=>depend++}
]
},
{
bg:"night",
pages:[
{name:"",text:"夜。\nスマホが震えた。"},
{name:"リリア",text:"『また来てね♡』"}
],
choices:[
{text:"すぐ返す",effect:()=>depend+=2},
{text:"少し待つ",effect:()=>reality++}
]
},
{
bg:"station",
pages:[
{name:"リリア",text:"「最近、来ないね？」"},
{name:"",text:"少し、疲れている自分に気づいた。"}
],
choices:[
{text:"ごめん",effect:()=>love++},
{text:"距離を置く",effect:()=>reality+=3},
{text:"寂しかった",effect:()=>depend+=2}
]
}
];

/* 開始 */
function startGame(){
    titleScreen.style.display="none";
    ui.style.display="block";
    showScene();
}

/* 表示 */
function showScene(){
    const scene=scenes[sceneIndex];
    background.style.backgroundImage=`url(${backgrounds[scene.bg]})`;
    pageIndex=0;
    showPage();
}

function showPage(){
    const scene=scenes[sceneIndex];
    const page=scene.pages[pageIndex];
    name.textContent=page.name||"";
    text.textContent=page.text;
    choices.innerHTML="";
    text.onclick=()=>{
        pageIndex++;
        if(pageIndex>=scene.pages.length){
            text.onclick=null;
            showChoices();
        }else{
            showPage();
        }
    };
}

function showChoices(){
    scenes[sceneIndex].choices.forEach(c=>{
        const b=document.createElement("button");
        b.className="choice";
        b.textContent=c.text;
        b.onclick=()=>{
            c.effect();
            updateStats();
            sceneIndex++;
            if(sceneIndex>=scenes.length) endGame();
            else showScene();
        };
        choices.appendChild(b);
    });
}

function updateStats(){
    love.textContent=love;
    depend.textContent=depend;
    reality.textContent=reality;
}

function endGame(){
    ui.style.display="none";
    ending.style.display="flex";

    if(reality>=5){
        endingTitle.textContent="END『現実へ』";
        endingText.textContent="あなたは、自分の生活へ戻った。";
    }else if(depend>=5){
        endingTitle.textContent="END『沼』";
        endingText.textContent="気づけば、抜け出せなくなっていた。";
    }else{
        endingTitle.textContent="END『余韻』";
        endingText.textContent="少し甘い思い出だけが残った。";
    }
}
</script>
</body>
</html>
