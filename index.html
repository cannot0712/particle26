<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しは今日も、嘘をつく。</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:"Yu Gothic",sans-serif;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
}

/* 背景 */

#background{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    transition:1s;
    filter:brightness(.4);
}

/* 暗幕 */

#overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        rgba(0,0,0,.15),
        rgba(0,0,0,.8)
    );
}

/* タイトル */

#titleScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:20;
    background:black;
}

#title{
    font-size:60px;
    letter-spacing:4px;
    margin-bottom:15px;
}

#subtitle{
    opacity:.7;
    margin-bottom:40px;
}

button{
    background:#ff4fa3;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

/* UI */

#ui{
    display:none;
}

/* ステータス */

#stats{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,.5);
    padding:12px;
    border-radius:10px;
    z-index:5;
    line-height:1.8;
}

/* テキストボックス */

#textbox{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,.82);
    padding:28px;
    z-index:10;
}

#name{
    color:#ff7bc0;
    font-size:22px;
    margin-bottom:10px;
    font-weight:bold;
}

#text{
    min-height:140px;
    line-height:2;
    font-size:20px;
    white-space:pre-wrap;
    cursor:pointer;
}

/* 選択肢 */

#choices{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.choice{
    background:#1d1d1d;
    border:1px solid #ff4fa3;
    text-align:left;
}

/* ▼ */

#next{
    position:absolute;
    right:30px;
    bottom:20px;
    font-size:20px;
    opacity:0;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:0}
    50%{opacity:1}
    100%{opacity:0}
}

/* END */

#ending{
    position:absolute;
    inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:40px;
    z-index:50;
}

#ending h1{
    color:#ff7bc0;
    font-size:52px;
    margin-bottom:25px;
}

#ending p{
    max-width:700px;
    line-height:2;
}

/* 演出 */

.fade{
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.glitch{
    animation:glitch .1s infinite;
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(-2px,2px)}
    50%{transform:translate(2px,-2px)}
    75%{transform:translate(-1px,1px)}
}

</style>
</head>
<body>

<div id="game">

    <!-- 背景 -->
    <div id="background"></div>
    <div id="overlay"></div>

    <!-- タイトル -->
    <div id="titleScreen">

        <div id="title">推しは今日も、嘘をつく。</div>
        <div id="subtitle">コンカフェ嬢攻略ADV</div>

        <button onclick="startGame()">GAME START</button>

    </div>

    <!-- UI -->
    <div id="ui">

        <!-- ステータス -->
        <div id="stats">
            好感度：<span id="love">0</span><br>
            依存度：<span id="depend">0</span><br>
            現実性：<span id="reality">0</span>
        </div>

        <!-- テキスト -->
        <div id="textbox">

            <div id="name"></div>

            <div id="text"></div>

            <div id="choices"></div>

            <div id="next">▼</div>

        </div>

    </div>

    <!-- END -->
    <div id="ending">

        <h1 id="endingTitle"></h1>

        <p id="endingText"></p>

        <br><br>

        <button onclick="location.reload()">タイトルへ戻る</button>

    </div>

</div>

<script>

/* ステータス */

let love = 0;
let depend = 0;
let reality = 0;

let currentScene = 0;
let currentPage = 0;

/* 要素 */

const bg = document.getElementById("background");

const nameEl = document.getElementById("name");
const textEl = document.getElementById("text");
const choicesEl = document.getElementById("choices");
const nextEl = document.getElementById("next");

const loveEl = document.getElementById("love");
const dependEl = document.getElementById("depend");
const realityEl = document.getElementById("reality");

/* 背景 */

const backgrounds = {

cafe:
"https://picsum.photos/1200/800?1",

night:
"https://picsum.photos/1200/800?2",

street:
"https://picsum.photos/1200/800?3",

station:
"https://picsum.photos/1200/800?4"

};

/* シーン */

const scenes = [

{
bg:"street",

pages:[

{
name:"",
text:"ただの好奇心だった。\n少しだけ覗いてみるつもりだった。"
},

{
name:"",
text:"繁華街の路地裏。\n\n『Black Alice』という看板が目に入る。"
},

{
name:"",
text:"少しだけ。\n本当に、それだけのつもりだった。"
},

{
name:"リリア",
text:"「はじめまして〜！新人のご主人様？」"
}

],

choices:[

{
text:"おすすめのドリンクある？",
effect:()=>{love+=1;}
},

{
text:"こういう店初めてで…",
effect:()=>{love+=1; reality+=1;}
},

{
text:"君が一番人気？",
effect:()=>{depend+=1;}
}

]

},

{
bg:"cafe",

pages:[

{
name:"",
text:"距離が近い。"
},

{
name:"",
text:"でも、これが接客なんだろう。"
},

{
name:"リリア",
text:"「え〜、緊張してる？\nかわい〜♡」"
},

{
name:"",
text:"その笑顔が、妙に頭に残った。"
}

],

choices:[

{
text:"少し照れる",
effect:()=>{love+=1;}
},

{
text:"営業上手だね",
effect:()=>{reality+=1;}
},

{
text:"ドキッとする",
effect:()=>{depend+=1;}
}

]

},

{
bg:"street",

pages:[

{
name:"",
text:"帰り道。"
},

{
name:"",
text:"スマホが震えた。"
},

{
name:"リリア",
text:"『今日は来てくれてありがと〜♡』"
},

{
name:"",
text:"たったそれだけなのに、\n少し特別になれた気がした。"
}

],

choices:[

{
text:"すぐ返信する",
effect:()=>{depend+=2;}
},

{
text:"少し悩んで返す",
effect:()=>{reality+=1;}
}

]

},

{
bg:"night",

pages:[

{
name:"リリア",
text:"『また会いたいな』"
},

{
name:"",
text:"“営業”。"
},

{
name:"",
text:"そう分かっているのに、\n期待してしまう。"
}

],

choices:[

{
text:"俺も会いたい",
effect:()=>{love+=1; depend+=1;}
},

{
text:"ありがとう",
effect:()=>{reality+=1;}
}

]

},

{
bg:"cafe",

pages:[

{
name:"",
text:"気づけば、また来ていた。"
},

{
name:"リリア",
text:"「来てくれると思った♡」"
},

{
name:"",
text:"その言葉だけで、\n少し嬉しくなってしまう。"
}

],

choices:[

{
text:"会いたくて",
effect:()=>{love+=2;}
},

{
text:"なんとなく",
effect:()=>{reality+=1;}
},

{
text:"他の客にも言ってる？",
effect:()=>{depend+=1;}
}

]

},

{
bg:"cafe",

pages:[

{
name:"",
text:"リリアが、別の客に笑いかけている。"
},

{
name:"リリア",
text:"『だいすき〜♡』"
},

{
name:"",
text:"胸の奥が、少しざわついた。"
}

],

choices:[

{
text:"見なかったことにする",
effect:()=>{reality+=2;}
},

{
text:"嫉妬する",
effect:()=>{depend+=2;}
},

{
text:"もっと通えば変わる？",
effect:()=>{depend+=3;}
}

]

},

{
bg:"night",

pages:[

{
name:"",
text:"AM 2:43"
},

{
name:"",
text:"リリアから着信が来ている。"
},

{
name:"",
text:"心臓が少し跳ねた。"
}

],

choices:[

{
text:"すぐ出る",
effect:()=>{depend+=2; love+=1;}
},

{
text:"少し迷う",
effect:()=>{reality+=1;}
},

{
text:"出ない",
effect:()=>{reality+=2;}
}

]

},

{
bg:"station",

pages:[

{
name:"リリア",
text:"「最近、来る回数減ったよね？」"
},

{
name:"",
text:"少し疲れている自分に気づいていた。"
},

{
name:"",
text:"でも、離れるのも少し怖かった。"
}

],

choices:[

{
text:"ごめん",
effect:()=>{love+=1;}
},

{
text:"少し考えたくて",
effect:()=>{reality+=3;}
},

{
text:"嫉妬した",
effect:()=>{depend+=2;}
}

]

}

];

/* 開始 */

function startGame(){

document.getElementById("titleScreen").style.display="none";

document.getElementById("ui").style.display="block";

showScene();

}

/* ステータス */

function updateStats(){

loveEl.textContent = love;
dependEl.textContent = depend;
realityEl.textContent = reality;

}

/* タイピング */

function typeText(text, callback){

textEl.textContent = "";

let i = 0;

const interval = setInterval(()=>{

textEl.textContent += text[i];

i++;

if(i >= text.length){

clearInterval(interval);

nextEl.style.opacity = 1;

if(callback) callback();

}

},25);

}

/* シーン表示 */

function showScene(){

const scene = scenes[currentScene];

bg.style.backgroundImage =
`url(${backgrounds[scene.bg]})`;

showPage();

}

/* ページ表示 */

function showPage(){

const scene = scenes[currentScene];

const page = scene.pages[currentPage];

nameEl.textContent = page.name;

choicesEl.innerHTML = "";

nextEl.style.opacity = 0;

typeText(page.text);

textEl.onclick = ()=>{

currentPage++;

if(currentPage >= scene.pages.length){

textEl.onclick = null;

showChoices();

}else{

showPage();

}

};

}

/* 選択肢 */

function showChoices(){

choicesEl.innerHTML = "";

const scene = scenes[currentScene];

scene.choices.forEach(choice=>{

const btn = document.createElement("button");

btn.className = "choice fade";

btn.textContent = choice.text;

btn.onclick = ()=>{

choice.effect();

updateStats();

currentScene++;
currentPage = 0;

if(depend >= 10){

document.body.classList.add("glitch");

}else{

document.body.classList.remove("glitch");

}

if(currentScene >= scenes.length){

showEnding();

}else{

showScene();

}

};

choicesEl.appendChild(btn);

});

}

/* END */

function showEnding(){

document.getElementById("ui").style.display="none";

const end = document.getElementById("ending");

end.style.display = "flex";

const title = document.getElementById("endingTitle");

const text = document.getElementById("endingText");

/* TRUE */

if(reality >= 8){

title.textContent = "END『午前4時の改札』";

text.textContent =
`始発前の駅。

「ちゃんと、自分の生活に戻ろうと思って」

あなたは、
“推し”ではなく、
一人の女の子としてリリアを見ることにした。

彼女は少しだけ寂しそうに笑った。

でもその笑顔は、
初めて“営業”じゃない気がした。`;

}

/* BAD */

else if(depend >= 12){

title.textContent = "END『次の推しへ』";

text.textContent =
`気づけば、
感情を止められなくなっていた。

独占したかった。

特別になりたかった。

でも、
リリアには他にも客がいる。

店を出たあと、
ネオン街の光だけがやけに眩しかった。`;

}

/* HAPPY */

else{

title.textContent = "END『鎖越しの愛』";

text.textContent =
`「もう、他の人のところ行かないで」

リリアはそう言って笑った。

大学も、
仕事も、
少しずつ遠くなっていく。

でも、
彼女が隣にいるだけで幸せだった。`;

}

}

updateStats();

</script>
</body>
</html>
