<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Choice Adventure</title>

<!-- ドット絵フォント -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: #000;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #eee;
  }

  .bg {
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }

  .game {
    width: 620px;
    background: rgba(0,0,0,0.85);
    border: 2px solid #666;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .text {
    min-height: 120px;
    line-height: 1.8;
    margin-bottom: 20px;
    white-space: pre-line;
  }

  .choices button {
    width: 100%;
    margin: 6px 0;
    padding: 12px;
    background: #111;
    color: #fff;
    border: 2px solid #888;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
  }

  .choices button:hover {
    background: #333;
    border-color: #fff;
  }

  .guide {
    margin-top: 18px;
    padding: 12px;
    border: 2px solid;
    background: #000;
    font-size: 10px;
    line-height: 1.6;
    min-height: 50px;
    white-space: pre-line;
  }
</style>
</head>

<body>

<div class="bg" id="bg">
  <div class="game">
    <h1>CHOICE ADVENTURE</h1>
    <div class="text" id="story"></div>
    <div class="choices" id="choices"></div>
    <div class="guide" id="guide"></div>
  </div>
</div>

<script>
// =======================
// フラグ
// =======================
let memory = false;

// =======================
// 文字を少し壊す演出
// =======================
function glitch(text) {
  const chars = "!@#$%^&*?";
  return text.replace(/./g, c =>
    Math.random() < 0.06 ? chars[Math.floor(Math.random()*chars.length)] : c
  );
}

// =======================
// シーン定義
// =======================
const scenes = {
  1: {
    text: "ホウカゴノ ガッコウ。\nダレモ イナイ。",
    guide: "ボタンヲ エランデ クダサイ。",
    color: "#4da6ff",
    bg: "images/school.jpg",
    choices: [
      { label: "コエヲ サガス", next: 2 },
      { label: "カエル", next: 5 }
    ]
  },

  2: {
    text: "キョウシツ。\nコクバンニ モジガ アル。\n「――オモイダシテ」",
    guide: "ヨク デキマシタ。\nシラベテ ミマショウ。",
    color: "#f0c674",
    bg: "images/classroom.jpg",
    choices: [
      { label: "コクバンヲ シラベル", next: 3 },
      { label: "ロウカニ デル", next: 4 }
    ]
  },

  3: {
    text: "アタマノ オクデ、\nナニカガ メザメル。",
    guide: "……\nソレデ イイ。",
    color: "#ff9933",
    bg: "images/classroom.jpg",
    effect: () => { memory = true; },
    choices: [
      { label: "ロウカニ デル", next: 4 }
    ]
  },

  4: {
    text: "ロウカノ オク。\nアカイ トビラ。",
    guide: "ススムベキ デス。",
    color: "#ff5555",
    bg: "images/hallway.jpg",
    choices: [
      { label: "トビラヲ アケル", next: () => memory ? 6 : 7 },
      { label: "ヒキカエス", next: 5 }
    ]
  },

  5: {
    text: "ナニモ オコラナカッタ。\nヘイボンナ マイニチ。",
    guide: "……",
    color: "#666",
    bg: "images/school.jpg",
    choices: [
      { label: "モドル", next: 1 }
    ]
  },

  6: {
    text: "「オモイダシタネ。」\n「デモ モウ オソイ。」",
    guide: glitch("アリガトウ。\nコレデ カンセイ。"),
    color: "#ff0000",
    bg: "images/dark.jpg",
    choices: [
      { label: "タイトルへ", next: 1 }
    ]
  },

  7: {
    text: "トビラノ サキハ カラッポダッタ。",
    guide: glitch("ソレデ ヨカッタノニ。"),
    color: "#aa0000",
    bg: "images/dark.jpg",
    choices: [
      { label: "タイトルへ", next: 1 }
    ]
  }
};

// =======================
// 表示処理
// =======================
function showScene(id) {
  const scene = scenes[id];

  document.getElementById("bg").style.backgroundImage =
    `url('${scene.bg}')`;

  document.getElementById("story").innerText = scene.text;

  if (scene.effect) scene.effect();

  const guide = document.getElementById("guide");
  guide.innerText = scene.guide;
  guide.style.color = scene.color;
  guide.style.borderColor = scene.color;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scene.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = c.label;
    btn.onclick = () => {
      const next = typeof c.next === "function" ? c.next() : c.next;
      showScene(next);
    };
    choicesDiv.appendChild(btn);
  });
}

showScene(1);
</script>

</body>
</html>
